[package]
name = "weighbridge-gateway"
version = "1.0.0"
description = "Weighbridge serial-to-WebSocket gateway"
edition = "2021"
rust-version = "1.77"

[lib]
name = "weighbridge_gateway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serialport = "4"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2.3"
# TLS (wss://) for HTTPS-hosted frontends. `ring` avoids the NASM/CMake toolchain aws-lc-rs needs on Windows.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
